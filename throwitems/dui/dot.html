<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent;
      overflow: hidden;
    }

    .wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .dot {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 38%, rgba(255,255,255,1), rgba(255,255,255,0.65));
      box-shadow:
        0 0 24px rgba(255,255,255,0.7),
        0 0 60px rgba(255,255,255,0.2);
      animation: pulse 2.5s ease-in-out infinite;
    }

    .ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 90px;
      height: 90px;
      margin-top: -45px;
      margin-left: -45px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.25);
      animation: expand 2.8s cubic-bezier(0,0,0.2,1) infinite;
    }

    .line {
      width: 2px;
      height: 36px;
      background: linear-gradient(to bottom, rgba(255,255,255,0.55), transparent);
      margin-top: 6px;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.75; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.1); }
    }

    @keyframes expand {
      0% { transform: scale(1); opacity: 0.4; }
      80%, 100% { transform: scale(1.8); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="ring"></div>
    <div class="dot"></div>
    <div class="line"></div>
  </div>
</body>
</html>
