<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>Pickup DUI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    #container {
      display: none;
      align-items: center;
      justify-content: center;
      position: relative;
      width: 100%;
      height: 100%;
    }

    .pickup-card {
      position: absolute;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      border-radius: 12px;
      overflow: hidden;
      background: rgba(14, 14, 16, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.45),
        0 0 0 1px rgba(255, 255, 255, 0.04);
      opacity: 0;
      transform: scale(0.92);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    #container.visible .pickup-card {
      opacity: 1;
      transform: scale(1);
    }

    .card-key {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      background: rgba(255, 255, 255, 0.06);
      border-right: 1px solid rgba(255, 255, 255, 0.06);
      flex-shrink: 0;
    }

    .card-key span {
      font-size: 28px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.95);
      line-height: 1;
    }

    .card-body {
      display: flex;
      align-items: center;
      padding: 14px 28px 14px 20px;
    }

    .card-label {
      font-size: 32px;
      font-weight: 600;
      color: white;
      white-space: nowrap;
      letter-spacing: -0.2px;
    }
  </style>
</head>

<body>
  <div id="container">
    <div class="pickup-card">
      <div class="card-key"><span>E</span></div>
      <div class="card-body">
        <span class="card-label" id="label">Pick up</span>
      </div>
    </div>
  </div>

  <script>
    const container = document.getElementById('container');
    const label = document.getElementById('label');

    window.addEventListener('message', (event) => {
      const d = event.data;
      if (!d || d.action !== 'pickup-dui') return;

      if (typeof d.visible === 'boolean') {
        container.style.display = d.visible ? 'flex' : 'none';
        if (d.visible) {
          requestAnimationFrame(() => {
            container.className = 'visible';
          });
        } else {
          container.className = '';
        }
      }

      if (d.label) {
        label.textContent = d.label.charAt(0).toUpperCase() + d.label.slice(1);
      }
    });
  </script>
</body>

</html>
